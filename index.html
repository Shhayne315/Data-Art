<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Summer Holiday Trip</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">
            <h1>Summer Holiday Trip</h1>
        </div>
        <button id="theme-toggle" aria-label="Toggle theme">☀️</button>
    </header>
    <main>
        <nav id="filters">
            <p><em>Trip Itinerary Links</em></p>
        </nav>
        <section id="timeline">
            <article class="timeline-event">
                <div class="event-time">9:00 AM</div>
                <div class="event-marker"></div>
                <div class="event-card">
                    <figure>
                        <img src="https://placehold.co/600x400/818CF8/FFFFFF?text=Departure" alt="Placeholder image for departure">
                        <figcaption>Day 1</figcaption>
                    </figure>
                    <div class="event-details">
                        <h2>The Trip Begins!</h2>
                        <p>Our summer holiday adventure starts today.</p>
                        <time datetime="2025-09-01">September 1, 2025</time>
                    </div>
                </div>
            </article>
            <article class="timeline-event">
                <div class="event-time">1:00 PM</div>
                <div class="event-marker"></div>
                <div class="event-card">
                    <figure>
                        <img src="https://placehold.co/600x400/F59E0B/FFFFFF?text=Arrival" alt="Placeholder image for arrival">
                        <figcaption>Day 1</figcaption>
                    </figure>
                    <div class="event-details">
                        <h2>Arrival & Check-in</h2>
                        <p>Checked into our hotel and ready to explore.</p>
                        <time datetime="2025-09-01">September 1, 2025</time>
                    </div>
                </div>
            </article>
        </section>
    </main>
    <div id="modal">
        <div class="modal-content">
        </div>
    </div>
</body>
</html>
